<!-- =========================
     티어표
========================== -->

<div
  id="tierPage"
  class="page active-page"
>

  <div class="container">

    <h1>ER123 티어표</h1>

    <p class="subtitle">
      사람 이름을 검색해서 티어를 확인하세요.
    </p>


    <!-- 검색 -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="검색"
      >

      <button onclick="searchPerson()">
        검색
      </button>

    </div>


    <div id="result"></div>


    <h2>전체 티어</h2>

    <div id="peopleList"></div>

  </div>

</div>


<!-- =========================
     프로필
========================== -->

<div
  id="profilePage"
  class="page profile-page"
>

  <div class="profile-container">

    <h1>프로필</h1>

    <p class="profile-subtitle">
      등록된 프로필을 확인하고 수정할 수 있습니다.
    </p>


    <!-- 프로필 목록 -->

    <div
      id="profileList"
      class="profile-list"
    ></div>


    <!-- 새 프로필 추가 -->

    <div class="add-profile-box">

      <h2>새 프로필 추가</h2>

      <div class="add-profile-form">

        <input
          type="text"
          id="nameInput"
          placeholder="사람 이름 입력"
        >

        <select id="tierInput">

          <option value="S">
            S TIER
          </option>

          <option value="A">
            A TIER
          </option>

          <option value="B">
            B TIER
          </option>

        </select>

        <button onclick="addPerson()">
          프로필 추가
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =========================
     팀 만들기
========================== -->

<div id="teamPage" class="page">
  <div class="team-page">
    <div class="team-container">

      <h1>팀 만들기</h1>

      <p class="team-subtitle">
        S / A / B 티어에서 한 명씩 랜덤으로 팀을 만듭니다.
      </p>

      <button class="random-team-button" onclick="createRandomTeam()">
        랜덤 팀 생성
      </button>

      <div id="teamResult" class="team-result"></div>

    </div>
  </div>
</div>


<!-- =========================

<div

    <p>
      저장된 팀을 보여주는 공간입니다.
    </p>

  </div>

</div>

  <!-- =========================
       페이지 전환
  ========================== -->

  <script>

    function showPage(page, button) {

      // 모든 페이지 숨기기

      document
        .querySelectorAll(".page")
        .forEach(function(element) {

          element.classList.remove("active-page");

        });


      // 모든 메뉴 선택 해제

      document
        .querySelectorAll(".sidebar-item")
        .forEach(function(element) {

          element.classList.remove("active");

        });


      // 선택한 페이지 표시

      const targetPage =
        document.getElementById(page + "Page");

      if (targetPage) {

        targetPage.classList.add("active-page");

      }


      // 클릭한 메뉴 활성화

      if (button) {

        button.classList.add("active");

      }


      // 프로필 페이지를 열었을 때
      // 프로필 목록 불러오기

      if (page === "profile") {

        loadProfiles();

      }

    }

  </script>
