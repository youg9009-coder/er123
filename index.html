<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER123 티어표</title>

</head>

<body>
  <div class="container">

    <h1>ER123 티어표</h1>

    <p class="subtitle">
      사람 이름을 검색해서 티어를 확인하세요.
    </p>

    <!-- 검색 -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="검색"
      >
      <button onclick="searchPerson()">검색</button>
    </div>

    <div id="result"></div>

    <h2>전체 티어</h2>

    <div id="peopleList"></div>

    <!-- 사람 추가 -->
    <h2>사람 추가</h2>

    <div class="search-box">
      <input
        type="text"
        id="nameInput"
        placeholder="사람 이름 입력"
      >

      <select id="tierInput">
        <option value="S">S</option>
        <option value="A">A</option>
        <option value="B">B</option>
      </select>

      <button onclick="addPerson()">추가</button>
    </div>

  </div>
